name: Deploy Azure Resources (Bicep)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment (dev / test / prod)'
        required: true
        default: dev
      resource:
        description: 'Resource to deploy (vnet / nsg)'
        required: true
        default: vnet

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # ① Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # ② Azure Login
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # ③ 変数設定
      - name: Set variables
        run: |
          ENV=${{ github.event.inputs.environment }}
          RES=${{ github.event.inputs.resource }}

          echo "ENV=$ENV" >> $GITHUB_ENV
          echo "RES=$RES" >> $GITHUB_ENV

          if [ "$ENV" = "dev" ]; then
            echo "RG=dev-RG" >> $GITHUB_ENV
          elif [ "$ENV" = "test" ]; then
            echo "RG=test-RG" >> $GITHUB_ENV
          elif [ "$ENV" = "prod" ]; then
            echo "RG=prod-RG" >> $GITHUB_ENV
          else
            echo "❌ Invalid environment"
            exit 1
          fi

      # ✅ ここがポイント：作業ディレクトリを固定
      - name: Validate deployment
        working-directory: iac/bicep
        run: |
          if [ "$RES" = "vnet" ]; then
            TEMPLATE_FILE="main.bicep"
          else
            TEMPLATE_FILE="modules/$RES.bicep"
          fi

          az deployment group validate \
            --resource-group $RG \
            --template-file $TEMPLATE_FILE \
            --parameters @$ENV/$RES.bicepparam

      - name: What-if deployment
        working-directory: iac/bicep
        run: |
          if [ "$RES" = "vnet" ]; then
            TEMPLATE_FILE="main.bicep"
          else
            TEMPLATE_FILE="modules/$RES.bicep"
          fi

          az deployment group what-if \
            --resource-group $RG \
            --template-file $TEMPLATE_FILE \
            --parameters @$ENV/$RES.bicepparam

      - name: Deploy
        working-directory: iac/bicep
        run: |
          if [ "$RES" = "vnet" ]; then
            TEMPLATE_FILE="main.bicep"
          else
            TEMPLATE_FILE="modules/$RES.bicep"
          fi

          az deployment group create \
            --resource-group $RG \
            --template-file $TEMPLATE_FILE \
            --parameters @$ENV/$RES.bicepparam
