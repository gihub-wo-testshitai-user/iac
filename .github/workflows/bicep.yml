name: Deploy Azure Resources (Bicep)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment (dev / test / prod)'
        required: true
        default: dev
      resource:
        description: 'Resource to deploy (vnet / nsg)'
        required: true
        default: vnet

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # ① リポジトリ取得
      - name: Checkout repository
        uses: actions/checkout@v4

      # ② Azureログイン
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # ③ 環境・リソースごとの設定
      - name: Set variables
        run: |
          ENV=${{ github.event.inputs.environment }}
          RES=${{ github.event.inputs.resource }}

          echo "ENV=$ENV" >> $GITHUB_ENV
          echo "RES=$RES" >> $GITHUB_ENV

          # Resource Group 自動切替
          if [ "$ENV" = "dev" ]; then
            echo "RG=dev-RG" >> $GITHUB_ENV
          elif [ "$ENV" = "test" ]; then
            echo "RG=test-RG" >> $GITHUB_ENV
          elif [ "$ENV" = "prod" ]; then
            echo "RG=prod-RG" >> $GITHUB_ENV
          else
            echo "❌ Invalid environment"
            exit 1
          fi

          # ✅ ここ重要（./ を付ける）
          echo "PARAM_FILE=./iac/bicep/$ENV/$RES.bicepparam" >> $GITHUB_ENV

          # テンプレート切り替え
          if [ "$RES" = "vnet" ]; then
            echo "TEMPLATE_FILE=./iac/bicep/main.bicep" >> $GITHUB_ENV
          else
            echo "TEMPLATE_FILE=./iac/bicep/modules/$RES.bicep" >> $GITHUB_ENV
          fi

      # ✅ デバッグ（問題切り分け用）
      - name: Debug paths
        run: |
          echo "Current directory:"
          pwd

          echo "Files:"
          ls -R

          echo "Template file:"
          echo $TEMPLATE_FILE

          echo "Param file:"
          echo $PARAM_FILE

      # ④ Validate
      - name: Validate deployment
        run: |
          az deployment group validate \
            --resource-group $RG \
            --template-file $TEMPLATE_FILE \
            --parameters @$PARAM_FILE

      # ⑤ What-if
      - name: What-if deployment
        run: |
          az deployment group what-if \
            --resource-group $RG \
            --template-file $TEMPLATE_FILE \
            --parameters @$PARAM_FILE

      # ⑥ Deploy
      - name: Deploy
        run: |
          az deployment group create \
            --resource-group $RG \
            --template-file $TEMPLATE_FILE \
            --parameters @$PARAM_FILE
